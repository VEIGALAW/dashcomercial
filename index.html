<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Pipeline Comercial Veiga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --panel2:#f0f2f5; --ink:#141a23; --muted:#5d6878; --line:#e2e6ec;
  --brand:#0f2a47; --gold:#b8892d;
  --rm:#1f6feb; --rm-bg:#e7f0ff; --sn:#8a3ffc; --sn-bg:#f1e8ff;
  --late:#c62828; --late-bg:#fdecec; --warn:#b26a00; --warn-bg:#fff4e0; --ok:#1b7f3b; --ok-bg:#e6f5ea;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1117; --panel:#161b22; --panel2:#1d232c; --ink:#e6edf3; --muted:#8b97a7; --line:#2a313c;
    --brand:#9cc3ff; --gold:#e0b453;
    --rm:#6ea8ff; --rm-bg:#14243d; --sn:#b98cff; --sn-bg:#251a3a;
    --late:#ff7b72; --late-bg:#3a1618; --warn:#f0b75e; --warn-bg:#35260e; --ok:#56d17a; --ok-bg:#12301c;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0e1117; --panel:#161b22; --panel2:#1d232c; --ink:#e6edf3; --muted:#8b97a7; --line:#2a313c;
  --brand:#9cc3ff; --gold:#e0b453;
  --rm:#6ea8ff; --rm-bg:#14243d; --sn:#b98cff; --sn-bg:#251a3a;
  --late:#ff7b72; --late-bg:#3a1618; --warn:#f0b75e; --warn-bg:#35260e; --ok:#56d17a; --ok-bg:#12301c;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:var(--rm)}
.wrap{max-width:1500px;margin:0 auto;padding:0 16px}

/* lock */
#lock{min-height:100vh;display:grid;place-items:center;padding:16px}
.lockbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px;width:100%;max-width:380px;box-shadow:var(--shadow)}
.lockbox h1{font-size:20px;margin:0 0 4px}
.lockbox p{color:var(--muted);margin:0 0 18px}
.lockbox input[type=password]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel2)}
.lockbox label{display:flex;gap:8px;align-items:center;margin:12px 0 16px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 12px;cursor:pointer}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--panel);font-weight:600;width:100%;padding:11px}
.err{color:var(--late);min-height:20px;margin-top:8px}

/* header */
header{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top{display:flex;align-items:center;gap:14px;padding:12px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.logo{width:30px;height:30px;border-radius:8px;background:var(--brand);color:var(--panel);display:grid;place-items:center;font-weight:700}
.brand b{font-size:16px}
.brand small{display:block;color:var(--muted);font-size:12px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 11px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--panel2);color:var(--ink);font-weight:600}
select,input[type=search]{border:1px solid var(--line);border-radius:9px;padding:7px 10px;background:var(--panel)}
input[type=search]{width:190px}
nav.tabs{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{border:0;background:none;padding:10px 12px;border-bottom:2px solid transparent;cursor:pointer;color:var(--muted);white-space:nowrap}
nav.tabs button.on{color:var(--ink);border-color:var(--gold);font-weight:600}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left}
.kpi .n{font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:12px}
.kpi.late .n{color:var(--late)} .kpi.warn .n{color:var(--warn)}

/* tags */
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;letter-spacing:.2px;white-space:nowrap}
.tag.rm{background:var(--rm-bg);color:var(--rm)}
.tag.sn{background:var(--sn-bg);color:var(--sn)}
.tag.stage{background:var(--panel2);color:var(--muted);font-weight:500}
.tag.late{background:var(--late-bg);color:var(--late)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.owner{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.dot{width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;font-weight:700;color:#fff}

/* week */
.weekbar{display:flex;align-items:center;gap:8px;margin:4px 0 12px;flex-wrap:wrap}
.weekbar h2{font-size:16px;margin:0 8px 0 0}
.week{display:grid;grid-template-columns:repeat(var(--cols),minmax(220px,1fr));gap:10px;overflow-x:auto;padding-bottom:8px}
.day{background:var(--panel2);border:1px solid var(--line);border-radius:12px;min-height:200px;display:flex;flex-direction:column}
.day.today{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.day.overdue{background:var(--late-bg);border-color:transparent}
.dayh{padding:10px 12px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line)}
.dayh b{font-size:13px}
.dayh span{color:var(--muted);font-size:12px}
.daylist{padding:8px;display:flex;flex-direction:column;gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 10px;cursor:pointer;box-shadow:var(--shadow);border-left:3px solid var(--rm)}
.card.SINAPSE{border-left-color:var(--sn)}
.card:hover{border-color:var(--gold)}
.card .r1{display:flex;gap:6px;align-items:center;justify-content:space-between;margin-bottom:3px}
.card .co{font-weight:600}
.card .who{color:var(--muted);font-size:12px}
.card .ns{font-size:12.5px;margin:5px 0}
.card .r3{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.empty{color:var(--muted);font-size:12px;text-align:center;padding:16px 4px}

/* kanban */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:10px;overflow-x:auto;padding-bottom:10px}
.col{background:var(--panel2);border:1px solid var(--line);border-radius:12px}
.colh{padding:10px 12px;border-bottom:1px solid var(--line)}
.colh b{font-size:13px}
.colh small{display:block;color:var(--muted);font-size:11px}

/* table */
.tablewrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:980px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--panel)}
tr:hover td{background:var(--panel2);cursor:pointer}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}

/* feed */
.feed{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 14px}
.fi{display:grid;grid-template-columns:90px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.fi:last-child{border:0}
.fi .d{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.fi .t{font-size:13px}

/* playbook */
.pb{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.pbc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.pbc h3{margin:0 0 8px;font-size:15px}
.pbc ol,.pbc ul{margin:0;padding-left:18px}
.pbc li{margin:4px 0}
.pbc table{min-width:0}
.pbc td,.pbc th{padding:6px;font-size:12.5px}
.src{color:var(--muted);font-size:12px;margin-top:14px}

/* drawer */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:40}
#drawer{position:fixed;top:0;right:0;height:100%;width:min(520px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:41;transform:translateX(100%);transition:transform .18s ease;overflow-y:auto}
#drawer.open{transform:none}
#scrim.open{display:block}
.dw{padding:18px}
.dw h2{margin:6px 0 2px;font-size:19px}
.dw .sub{color:var(--muted)}
.grid2{display:grid;grid-template-columns:120px 1fr;gap:6px 10px;margin:14px 0;font-size:13px}
.grid2 dt{color:var(--muted)}
.grid2 dd{margin:0;word-break:break-word}
.box{background:var(--panel2);border-radius:10px;padding:12px;margin:12px 0}
.box h4{margin:0 0 6px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.tl .it{position:relative;padding:6px 0}
.tl .it:before{content:"";position:absolute;left:-20px;top:11px;width:10px;height:10px;border-radius:50%;background:var(--panel);border:2px solid var(--gold)}
.tl .it .m{color:var(--muted);font-size:12px}
.x{float:right}
.hide{display:none!important}
footer{color:var(--muted);font-size:12px;padding:24px 0}

/* banner */
.banner{margin:14px 0 0;padding:10px 14px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:13px}

/* métricas */
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.mcard h3{margin:0 0 4px;font-size:15px}
.mcard .hint{color:var(--muted);font-size:12px;margin:0 0 12px}
.bar{display:grid;grid-template-columns:150px 1fr 100px;gap:8px;align-items:center;margin:6px 0;font-size:12.5px}
.bar .track{background:var(--panel2);border-radius:6px;height:18px;overflow:hidden}
.bar .fill{height:100%;background:var(--brand);border-radius:6px}
.bar .fill.sn{background:var(--sn)} .bar .fill.gold{background:var(--gold)}
.bar .v{font-variant-numeric:tabular-nums;text-align:right;color:var(--muted)}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.big div{background:var(--panel2);border-radius:10px;padding:10px 12px}
.big b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.big span{font-size:12px;color:var(--muted)}
.mcard table{min-width:0}
.mcard td,.mcard th{padding:6px 8px;font-size:12.5px}

/* composer */
.comp label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px}
.comp textarea,.comp input,.comp select{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--panel)}
.comp textarea{min-height:56px;resize:vertical}
.comp .row{display:grid;grid-template-columns:1fr 110px;gap:8px}
.comp .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.comp pre{white-space:pre-wrap;background:var(--panel);border:1px dashed var(--line);border-radius:8px;padding:8px;font-size:12px;margin:10px 0 0}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:600}

@media (max-width:700px){
  header{position:static}
  input[type=search]{width:100%}
  .filters{width:100%}
  .week{grid-template-columns:1fr}
  .grid2{grid-template-columns:100px 1fr}
}
</style>
</head>
<body>

<div id="lock">
  <form class="lockbox" id="lockform">
    <div class="logo" style="margin-bottom:12px">V</div>
    <h1>Pipeline Comercial</h1>
    <p>Rainmaker + SINAPSE. Digite a senha do time.</p>
    <input type="password" id="pw" placeholder="Senha" autocomplete="current-password" autofocus>
    <label><input type="checkbox" id="remember" checked> Lembrar neste computador</label>
    <button class="btn primary" type="submit" id="unlockbtn">Entrar</button>
    <div class="err" id="err"></div>
  </form>
</div>

<div id="app" class="hide">
<header>
  <div class="wrap">
    <div class="top">
      <div class="brand"><div class="logo">V</div><div><b>Pipeline Comercial</b><small id="upd"></small></div></div>
      <div class="filters">
        <div class="seg" id="fproj">
          <button data-v="" class="on">Todos</button><button data-v="Rainmaker">Rainmaker</button><button data-v="SINAPSE">SINAPSE</button>
        </div>
        <select id="fowner" aria-label="Responsável"></select>
        <input type="search" id="fq" placeholder="Buscar lead, empresa…">
        <button class="btn" id="theme" title="Tema claro/escuro">◐</button>
        <button class="btn" id="logout" title="Sair e esquecer a senha neste PC">Sair</button>
      </div>
    </div>
    <nav class="tabs" id="tabs">
      <button data-t="semana" class="on">Semana</button>
      <button data-t="pipeline">Pipeline</button>
      <button data-t="leads">Todos os leads</button>
      <button data-t="metricas">Métricas</button>
      <button data-t="mov">Movimentos</button>
      <button data-t="playbook">Playbook</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="banner hide" id="banner"></div>
  <section class="kpis" id="kpis"></section>

  <section id="v-semana">
    <div class="weekbar">
      <h2 id="wklabel"></h2>
      <button class="btn" id="wkprev">◀</button>
      <button class="btn" id="wktoday">Esta semana</button>
      <button class="btn" id="wknext">▶</button>
    </div>
    <div class="week" id="week"></div>
  </section>

  <section id="v-pipeline" class="hide"><div class="kanban" id="kanban"></div></section>

  <section id="v-leads" class="hide"><div class="tablewrap"><table id="tbl"></table></div></section>

  <section id="v-metricas" class="hide"><div id="metricas"></div></section>

  <section id="v-mov" class="hide"><div class="feed" id="feed"></div></section>

  <section id="v-playbook" class="hide"><div id="playbook"></div></section>

  <footer id="foot"></footer>
</main>
</div>

<div id="scrim"></div>
<aside id="drawer" aria-label="Detalhe do lead"></aside>

<script>
(() => {
const STAGES = [
  {k:"engajado",       rm:"Engajado",            sn:"Engajado",              sla:2,  exit:"Lead respondeu com interesse"},
  {k:"material",       rm:"Material enviado",    sn:"Apresentação enviada",  sla:7,  exit:"Material/tese entregue por escrito"},
  {k:"agendando",      rm:"Agendando reunião",   sn:"Agendando reunião",     sla:5,  exit:"Lead aceitou conversar; falta data"},
  {k:"reuniao_marcada",rm:"Reunião marcada",     sn:"Reunião marcada",       sla:99, exit:"Data e hora confirmadas"},
  {k:"reuniao_feita",  rm:"Diagnóstico / reunião feita", sn:"Reunião feita", sla:3, exit:"Reunião realizada; dor e decisor mapeados"},
  {k:"proposta",       rm:"Proposta / BP enviada", sn:"Termo de parceria enviado", sla:7, exit:"Proposta formal na mão do decisor"},
  {k:"negociacao",     rm:"Negociação / contrato", sn:"Ajustando termos",    sla:5,  exit:"Discussão de condições ou assinatura"},
  {k:"ganho",          rm:"Contrato fechado",    sn:"Parceria fechada",      sla:999,exit:"Assinado"},
  {k:"nutrir",         rm:"Nutrir (morno)",      sn:"Nutrir (morno)",        sla:45, exit:"Sem timing agora; retomar com gatilho"},
  {k:"perdido",        rm:"Perdido",             sn:"Perdido",               sla:999,exit:"Desqualificado ou disse não"},
];
const STG = Object.fromEntries(STAGES.map((s,i)=>[s.k,{...s,i}]));
// Probabilidade de fechamento por estágio (para o pipeline ponderado)
const PROB = {engajado:.05, material:.10, agendando:.15, reuniao_marcada:.25, reuniao_feita:.35, proposta:.50, negociacao:.75, ganho:1, nutrir:.02, perdido:0};
const FUNIL = ["engajado","material","agendando","reuniao_marcada","reuniao_feita","proposta","negociacao","ganho"];
const BRL = v => v == null ? "—" : v.toLocaleString("pt-BR", {style:"currency", currency:"BRL", maximumFractionDigits:0});
const OPEN = new Set(["engajado","material","agendando","reuniao_marcada","reuniao_feita","proposta","negociacao","nutrir"]);
const OWNER_COLORS = {Rafael:"#0f2a47",Lucas:"#1b7f3b",Aline:"#b8892d",Ricardo:"#8a3ffc","Sem dono":"#c62828"};
const DOW = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const MES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const LS = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}, del(k){try{localStorage.removeItem(k)}catch(e){}}};

let DB = null, view = LS.get("dash.tab") || "semana", weekOffset = 0, sortKey = "proxima_data", sortDir = 1;
const F = {proj:"", owner:"", q:"", kpi:""};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- datas ---------- */
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const TODAY = iso(new Date());
const daysBetween = (a,b) => Math.round((parse(b) - parse(a)) / 864e5);
const fmt = s => s ? `${parse(s).getDate()} ${MES[parse(s).getMonth()]}` : "—";
const fmtDow = s => s ? `${DOW[parse(s).getDay()]} ${fmt(s)}` : "—";
function monday(offset){ const d = new Date(); const wd = (d.getDay()+6)%7; d.setDate(d.getDate()-wd+offset*7); return d; }

/* ---------- cripto ---------- */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(blob, pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(blob.salt), iterations:blob.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(blob.iv)}, key, b64(blob.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function unlock(pw, remember){
  const r = await fetch("data/leads.enc.json?ts=" + Date.now(), {cache:"no-store"});
  if(!r.ok) throw new Error("Não consegui baixar os dados (" + r.status + ").");
  const blob = await r.json();
  let db;
  try { db = await decrypt(blob, pw); } catch(e){ throw new Error("Senha incorreta."); }
  if(remember) LS.set("dash.pw", pw);
  return db;
}

/* ---------- derivados ---------- */
function enrich(l){
  const s = STG[l.estagio] || STG.engajado;
  l._stage = l.projeto === "SINAPSE" ? s.sn : s.rm;
  l._open = OPEN.has(l.estagio);
  l._idle = l.ultimo_toque ? daysBetween(l.ultimo_toque, TODAY) : null;
  l._late = l._open && l.proxima_data && l.proxima_data < TODAY;
  l._stale = l._open && l._idle != null && l._idle > s.sla;
  l._nodate = l._open && !l.proxima_data;
  l._text = [l.nome,l.empresa,l.cargo,l.responsavel,l.proximo_passo,l.o_que_respondeu,(l.email||[]).join(" "),l.telefone,l.subfrente].join(" ").toLowerCase();
  return l;
}
function filtered(){
  const q = F.q.trim().toLowerCase();
  return DB.leads.filter(l =>
    (!F.proj || l.projeto === F.proj) &&
    (!F.owner || l.responsavel === F.owner) &&
    (!q || l._text.includes(q)) &&
    (!F.kpi || KPI_FILTERS[F.kpi](l)));
}
const startW = () => iso(monday(0)), endW = () => { const d = monday(0); d.setDate(d.getDate()+6); return iso(d); };
const KPI_FILTERS = {
  ativos: l => l._open && l.estagio !== "nutrir",
  late:   l => l._late,
  hoje:   l => l._open && l.proxima_data === TODAY,
  semana: l => l._open && l.proxima_data >= startW() && l.proxima_data <= endW(),
  prop:   l => ["proposta","negociacao"].includes(l.estagio),
  stale:  l => l._stale && l.estagio !== "nutrir",
  semdono:l => l._open && (l.responsavel === "Sem dono" || l.repassar),
};

/* ---------- componentes ---------- */

function renderWeek(){
  const mon = monday(weekOffset), days = [];
  for(let i=0;i<7;i++){ const d = new Date(mon); d.setDate(mon.getDate()+i); days.push(iso(d)); }
  const list = filtered().filter(l => l._open);
  const by = {}; list.forEach(l => { if(l.proxima_data) (by[l.proxima_data] ||= []).push(l); });
  const sortDay = a => a.sort((x,y) => (x.proxima_hora||"99").localeCompare(y.proxima_hora||"99") || STG[y.estagio].i - STG[x.estagio].i);
  const cols = [];
  if(weekOffset === 0){
    const late = sortDay(list.filter(l => l._late));
    cols.push(`<div class="day overdue"><div class="dayh"><b>Atrasados</b><span>${late.length}</span></div><div class="daylist">${late.map(l=>card(l,true)).join("") || '<div class="empty">Nada atrasado.</div>'}</div></div>`);
  }
  days.forEach((d,i) => {
    const items = sortDay(by[d] || []);
    if(i >= 5 && !items.length) return;
    cols.push(`<div class="day ${d===TODAY?"today":""}"><div class="dayh"><b>${DOW[parse(d).getDay()]} ${fmt(d)}</b><span>${items.length||""}</span></div><div class="daylist">${items.map(l=>card(l,false)).join("") || '<div class="empty">Sem contatos.</div>'}</div></div>`);
  });
  $("#week").style.setProperty("--cols", cols.length);
  $("#week").innerHTML = cols.join("");
  const sun = new Date(mon); sun.setDate(mon.getDate()+6);
  $("#wklabel").textContent = `Semana ${fmt(iso(mon))} – ${fmt(iso(sun))}`;
}

/* ---------- métricas ---------- */
function bars(rows, max, cls){
  return rows.map(([label, n, extra]) => `<div class="bar"><span>${esc(label)}</span><div class="track"><div class="fill ${cls||""}" style="width:${max?Math.max(n/max*100, n?2:0):0}%"></div></div><span class="v">${extra ?? n}</span></div>`).join("");
}
function reached(l){
  // estágio mais avançado do funil que o lead já atingiu (pela trilha + estágio atual)
  const seen = [...(l.trilha||[]).map(t => t.estagio), l.estagio].map(k => FUNIL.indexOf(k)).filter(i => i >= 0);
  return seen.length ? Math.max(...seen) : 0;
}
function renderMetrics(){
  const list = filtered();
  const open = list.filter(l => l._open && l.estagio !== "nutrir");
  const won = list.filter(l => l.estagio === "ganho"), lost = list.filter(l => l.estagio === "perdido");
  const sum = (a, f) => a.reduce((s, l) => s + (f(l) || 0), 0);
  const pipe = sum(open, l => l.valor_honorarios), weighted = sum(open, l => (l.valor_honorarios||0) * PROB[l.estagio]);
  const credit = sum(open, l => l.credito_estimado);
  const semValor = open.filter(l => l.valor_honorarios == null).length;
  const winRate = won.length + lost.length ? Math.round(won.length / (won.length + lost.length) * 100) + "%" : "—";
  const ciclos = won.map(l => { const t = l.trilha||[]; return t.length ? daysBetween(t[0].data, t[t.length-1].data) : null; }).filter(x => x != null);
  const ciclo = ciclos.length ? Math.round(ciclos.reduce((a,b)=>a+b,0)/ciclos.length) + " dias" : "—";

  const reach = FUNIL.map((k, i) => list.filter(l => reached(l) >= i).length);
  const funil = FUNIL.map((k, i) => [STG[k].rm, reach[i], `${reach[i]}${i ? ` · ${reach[i-1] ? Math.round(reach[i]/reach[i-1]*100) : 0}%` : ""}`]);

  const owners = [...new Set(list.map(l => l.responsavel))].sort();
  const ownRows = owners.map(o => { const a = list.filter(l => l.responsavel === o);
    return `<tr><td>${ownerChip(o)}</td><td class="num">${a.filter(l=>l._open&&l.estagio!=="nutrir").length}</td><td class="num">${a.filter(l=>l._late||(l._open&&l.proxima_data===TODAY)).length}</td><td class="num">${a.filter(l=>l._stale&&l.estagio!=="nutrir").length}</td><td class="num">${a.filter(l=>["proposta","negociacao"].includes(l.estagio)).length}</td><td class="num">${a.filter(l=>l.estagio==="ganho").length}</td><td class="num">${BRL(sum(a.filter(l=>l._open), l=>(l.valor_honorarios||0)*PROB[l.estagio]))}</td></tr>`; }).join("");

  const byStage = STAGES.filter(s => OPEN.has(s.k)).map(s => {
    const a = list.filter(l => l.estagio === s.k);
    const avg = a.length ? Math.round(a.reduce((x, l) => x + (l.estagio_desde ? daysBetween(l.estagio_desde, TODAY) : 0), 0) / a.length) : 0;
    return [s.rm, avg, `${avg}d · ${a.length} leads`];
  });
  const proj = ["Rainmaker","SINAPSE"].map(p => [p, list.filter(l => l.projeto === p && l._open && l.estagio !== "nutrir").length]);
  const motivos = {}; lost.forEach(l => { const m = l.motivo_perda || "Sem motivo registrado"; motivos[m] = (motivos[m]||0) + 1; });
  const maxReach = Math.max(...reach, 1);

  $("#metricas").innerHTML = `<div class="mgrid">
    <div class="mcard"><h3>Dinheiro na mesa</h3><p class="hint">Honorários estimados dos leads abertos. O ponderado multiplica pela chance de fechar em cada estágio.</p>
      <div class="big"><div><b>${BRL(pipe)}</b><span>Pipeline (honorários)</span></div><div><b>${BRL(weighted)}</b><span>Ponderado</span></div><div><b>${BRL(credit)}</b><span>Crédito estimado dos clientes</span></div></div>
      ${semValor ? `<p class="hint" style="margin:0">${semValor} leads abertos sem valor estimado. Peça no Prometheus: <i>EMPRESA | valor R$ 80 mil de honorários / crédito R$ 2 mi</i>.</p>` : ""}</div>
    <div class="mcard"><h3>Resultado</h3><p class="hint">Fechados no período todo da base.</p>
      <div class="big"><div><b>${won.length}</b><span>Contratos / parcerias</span></div><div><b>${lost.length}</b><span>Perdidos</span></div><div><b>${winRate}</b><span>Taxa de ganho</span></div><div><b>${ciclo}</b><span>Ciclo médio até fechar</span></div></div></div>
    <div class="mcard"><h3>Funil de conversão</h3><p class="hint">Quantos leads já chegaram a cada etapa e o % que passou da etapa anterior.</p>${bars(funil, maxReach)}</div>
    <div class="mcard"><h3>Tempo médio no estágio atual</h3><p class="hint">Onde o pipeline está empoçando.</p>${bars(byStage, Math.max(...byStage.map(b=>b[1]),1), "gold")}</div>
    <div class="mcard" style="grid-column:1/-1"><h3>Por responsável</h3><p class="hint">Hoje = vencendo hoje + atrasados. Ponderado = honorários × chance de fechar.</p>
      <div class="tablewrap" style="border:0"><table style="min-width:640px"><thead><tr><th>Dono</th><th>Ativos</th><th>Hoje</th><th>Parados</th><th>Propostas</th><th>Ganhos</th><th>Ponderado</th></tr></thead><tbody>${ownRows}</tbody></table></div></div>
    <div class="mcard"><h3>Ativos por frente</h3><p class="hint">Rainmaker (clientes) × SINAPSE (parcerias).</p>${bars(proj.map(([p,n])=>[p,n]), Math.max(...proj.map(p=>p[1]),1))}</div>
    <div class="mcard"><h3>Motivos de perda</h3><p class="hint">Registre no grupo: <i>#perdido EMPRESA | motivo</i>.</p>${Object.keys(motivos).length ? bars(Object.entries(motivos).sort((a,b)=>b[1]-a[1]), Math.max(...Object.values(motivos))) : '<div class="empty">Nenhum perdido ainda.</div>'}</div>
  </div>`;
}

      <dt>E-mail</dt><dd>${(l.email||[]).map(e=>`<a href="mailto:${esc(e)}">${esc(e)}</a>`).join("<br>")||"—"}</dd>
      <dt>Telefone</dt><dd>${esc(l.telefone)||"—"}${wa?` · <a href="${wa}" target="_blank" rel="noopener">WhatsApp</a>`:""}</dd>
      <dt>LinkedIn</dt><dd>${l.linkedin?`<a href="${esc(l.linkedin)}" target="_blank" rel="noopener">abrir perfil</a>`:"—"}</dd>
      <dt>Canal principal</dt><dd>${esc(l.canal)||"—"}</dd>
      <dt>Respondeu em</dt><dd>${fmt(l.respondeu_em)}</dd>
      <dt>Último toque</dt><dd>${fmt(l.ultimo_toque)}${l._idle!=null?` (${l._idle} dias)`:""}</dd>
      <dt>Honorários est.</dt><dd>${BRL(l.valor_honorarios)}</dd>
      <dt>Crédito est.</dt><dd>${BRL(l.credito_estimado)}</dd>
      <dt>No estágio desde</dt><dd>${fmt(l.estagio_desde)}</dd>
      ${l.motivo_perda?`<dt>Motivo da perda</dt><dd>${esc(l.motivo_perda)}</dd>`:""}
    </dl>
    ${composer(l)}
    ${l.o_que_respondeu?`<div class="box"><h4>O que o lead disse</h4>${esc(l.o_que_respondeu)}</div>`:""}
    <div class="box"><h4>Histórico</h4><div class="tl">${(l.historico||[]).slice().sort((a,b)=>(b.data||"").localeCompare(a.data||"")).map(h =>
      `<div class="it"><div class="m">${fmt(h.data)} · ${esc(h.autor)}${h.fonte?" · "+esc(h.fonte):""}</div>${esc(h.texto)}</div>`).join("") || "—"}</div></div>
  </div>`;
  $("#drawer").classList.add("open"); $("#scrim").classList.add("open");
  $("#dwclose").onclick = closeLead;
  const upd = () => { $("#c-out").textContent = composerMsg(l); };
  ["#c-what","#c-next","#c-date","#c-time","#c-stage"].forEach(id => $(id).addEventListener("input", upd));
  upd();
  $("#c-copy").onclick = async () => {
    const txt = composerMsg(l);
    try { await navigator.clipboard.writeText(txt); $("#c-copy").textContent = "Copiado ✓"; }
    catch(e){ const r = document.createRange(); r.selectNodeContents($("#c-out")); getSelection().removeAllRanges(); getSelection().addRange(r); $("#c-copy").textContent = "Selecionado: Ctrl+C"; }
    setTimeout(() => { $("#c-copy").textContent = "Copiar mensagem"; }, 2000);
  };
}
function closeLead(){ $("#drawer").classList.remove("open"); $("#scrim").classList.remove("open"); }

/* ---------- orquestração ---------- */
function render(){
  renderKpis();
  if(!["semana","pipeline","leads","metricas","mov","playbook"].includes(view)) view = "semana";
  ["semana","pipeline","leads","metricas","mov","playbook"].forEach(v => $("#v-"+v).classList.toggle("hide", v !== view));
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.t === view));
  ({semana:renderWeek, pipeline:renderKanban, leads:renderTable, metricas:renderMetrics, mov:renderFeed, playbook:renderPlaybook})[view]();
}
function boot(db){
  DB = db; DB.leads.forEach(enrich);
  $("#lock").classList.add("hide"); $("#app").classList.remove("hide");
  const owners = [...new Set([...(DB.equipe||[]), ...DB.leads.map(l => l.responsavel)])];
  $("#fowner").innerHTML = `<option value="">Todos os donos</option>` + owners.map(o => `<option>${esc(o)}</option>`).join("");
  const dt = new Date(DB.publicado_em || DB.atualizado_em);
  // Robô roda 7h45 e 19h todo dia; mais de 14h sem publicar = alguma rodada falhou
  const horas = Math.round((Date.now() - dt) / 36e5);
  const now = new Date(), wd = now.getDay();
  const limite = (wd === 0 || wd === 6 || (wd === 1 && now.getHours() < 9)) ? 62 : 14; // fim de semana o PC pode estar desligado
  if(horas > limite){
    $("#banner").textContent = `⚠️ O robô não atualiza o dash há ${horas} horas. Os dados podem estar desatualizados. Avise o Rafael (o PC dele precisa estar com o Claude aberto) ou rode o robô em outro PC.`;
    $("#banner").classList.remove("hide");
  }
  $("#upd").textContent = `Atualizado ${dt.toLocaleDateString("pt-BR")} ${dt.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})} · ${DB.leads.length} leads`;
  $("#foot").textContent = `Fonte: levantamento de 05/10/2026 + grupo Prometheus no Teams (sincronizado 1x por dia). Último sync do grupo: ${DB.prometheus?.ultima_msg ? new Date(DB.prometheus.ultima_msg).toLocaleString("pt-BR") : "—"}.`;
  render();
}

$("#lockform").addEventListener("submit", async e => {
  e.preventDefault(); $("#err").textContent = ""; $("#unlockbtn").disabled = true; $("#unlockbtn").textContent = "Abrindo…";
  try { boot(await unlock($("#pw").value, $("#remember").checked)); }
  catch(err){ $("#err").textContent = err.message; }
  finally { $("#unlockbtn").disabled = false; $("#unlockbtn").textContent = "Entrar"; }
});
$("#fproj").addEventListener("click", e => { const b = e.target.closest("button"); if(!b) return; F.proj = b.dataset.v; document.querySelectorAll("#fproj button").forEach(x => x.classList.toggle("on", x === b)); render(); });
$("#fowner").addEventListener("change", e => { F.owner = e.target.value; render(); });
$("#fq").addEventListener("input", e => { F.q = e.target.value; render(); });
$("#tabs").addEventListener("click", e => { const b = e.target.closest("button"); if(!b) return; view = b.dataset.t; LS.set("dash.tab", view); render(); });
$("#kpis").addEventListener("click", e => { const b = e.target.closest(".kpi"); if(!b) return; F.kpi = F.kpi === b.dataset.k ? "" : b.dataset.k; if(view === "semana" || view === "playbook") view = "leads"; render(); });
$("#wkprev").onclick = () => { weekOffset--; renderWeek(); };
$("#wknext").onclick = () => { weekOffset++; renderWeek(); };
$("#wktoday").onclick = () => { weekOffset = 0; renderWeek(); };
$("#tbl").addEventListener("click", e => { const th = e.target.closest("th"); if(th){ const k = th.dataset.k; sortDir = sortKey === k ? -sortDir : 1; sortKey = k; renderTable(); } });
document.addEventListener("click", e => { if(e.target.closest("#drawer")) return; const c = e.target.closest("[data-id]"); if(c) openLead(c.dataset.id); });
$("#scrim").onclick = closeLead;
document.addEventListener("keydown", e => { if(e.key === "Escape") closeLead(); });
$("#logout").onclick = () => { LS.del("dash.pw"); location.reload(); };
$("#theme").onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const nxt = cur === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = nxt; LS.set("dash.theme", nxt);
};
const th = LS.get("dash.theme"); if(th) document.documentElement.dataset.theme = th;

const saved = LS.get("dash.pw");
if(saved) unlock(saved, true).then(boot).catch(() => LS.del("dash.pw"));
})();
</script>
</body>
</html>
